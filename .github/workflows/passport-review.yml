name: Software Signal Passport
on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number to reassess
        required: true
permissions: {}
concurrency:
  group: passport-${{ github.event.pull_request.number || github.event.issue.number || inputs.pr }}
  cancel-in-progress: false
jobs:
  passport:
    if: >-
      github.event_name != 'issue_comment' ||
      (github.event.issue.pull_request && startsWith(github.event.comment.body, '/passport '))
    permissions:
      contents: read
      pull-requests: write
      issues: read
      checks: read
      actions: read
    uses: suyog19/software-signal-passport/.github/workflows/passport.yml@e83cb738d3149498f253fc2919a8a98c61a3d173
    with:
      # Self-hosting only: trusted workflow source, never the assessed PR head.
      runtime-ref: ${{ github.workflow_sha }}
      pr: ${{ github.event.pull_request.number || github.event.issue.number || inputs.pr }}
    secrets:
      model-key: ${{ secrets.PASSPORT_MODEL_KEY }}
