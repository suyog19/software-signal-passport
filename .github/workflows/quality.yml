name: Controlled Passport replay
on:
  workflow_dispatch:
    inputs:
      pr:
        required: true
        description: Controlled fixture PR
permissions: {}
jobs:
  passport:
    permissions:
      contents: read
      pull-requests: write
      issues: read
      checks: read
      actions: read
    uses: suyog19/software-signal-passport/.github/workflows/passport.yml@0489c941d1107ab179f5c212cd1b69754997d804
    with:
      runtime-ref: 0489c941d1107ab179f5c212cd1b69754997d804
      pr: ${{ inputs.pr }}
